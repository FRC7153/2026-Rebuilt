#
# SYSTEMCORE BRANCH (2027 alpha). For the roboRIO use the `main` branch.
#
# Use this configuration file to control what RobotPy packages are installed
# on your SystemCore
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a8"

# Which optional robotpy components should be installed?
components = [
    "apriltag",
    "commands2",
    "sim",
]

# Other pip packages to install on the SystemCore (and locally via `robotpy sync`)
requires = [
    "phoenix6==26.70.0a2",
    "robotpy-rev==2027.0.0a9",
    # PathPlannerLib has no 2027 release yet. The code runs without it (teleop only,
    # no autos). When one is published, add it here, e.g.:
    # "robotpy-pathplannerlib==2027.x.y",
]

[tool.robotpy.pyfrc]
# Creating all of the simulated CTRE/REV devices takes a while on a laptop;
# give the robot more than the default 2 seconds to start in tests.
init_timeout = 60
