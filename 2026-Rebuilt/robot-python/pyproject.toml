#
# Use this configuration file to control what RobotPy packages are installed
# on your RoboRIO
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2026.2.2"

# Which optional robotpy components should be installed?
components = [
    "apriltag",
    "commands2",
    "sim",
]

# Other pip packages to install on the roboRIO (and locally via `robotpy sync`)
requires = [
    "phoenix6==26.3.0",
    "robotpy-rev==2026.0.4",
    "robotpy-pathplannerlib==2026.1.2",
]

[tool.robotpy.pyfrc]
# Creating all of the simulated CTRE/REV devices takes a while on a laptop;
# give the robot more than the default 2 seconds to start in tests.
init_timeout = 60
